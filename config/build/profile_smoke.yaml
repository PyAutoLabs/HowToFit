# Per-script environment variable configuration for automated runs
# (smoke tests, pre-release checks, CI).
#
# "defaults" are applied to every script on top of the inherited environment.
# "overrides" selectively unset or replace vars for matching path patterns.
#
# Pattern convention (same as no_run.yaml):
#   - Patterns containing '/' do a substring match against the file path
#   - Patterns without '/' match the file stem exactly

defaults:
  PYAUTO_TEST_MODE: "2"                     # 0=normal, 1=reduced iterations, 2=skip sampler (fastest)
  PYAUTO_SKIP_FIT_OUTPUT: "1"               # Skip pre/post-fit I/O, VRAM profiling, result text
  PYAUTO_SKIP_VISUALIZATION: "1"            # Skip fit visualization and plotting
  PYAUTO_SKIP_CHECKS: "1"                   # Skip mesh validation, position checks, weight thresholds
  PYAUTO_DISABLE_JAX: "1"                   # Force use_jax=False, avoid JIT compilation overhead
  JAX_ENABLE_X64: "True"                    # Enable 64-bit precision in JAX
  NUMBA_CACHE_DIR: "/tmp/numba_cache"       # Writable cache dir for numba
  MPLCONFIGDIR: "/tmp/matplotlib"           # Writable config dir for matplotlib

# (Removed on 2026-07-23: the two overrides here, `plot/emcee_plotter` and
# `plot/zeus_plotter`, were copied in from autofit_workspace's profile_smoke.yaml,
# where the identical patterns still live and still match. Those scripts exist
# only as autofit_workspace/scripts/plot/*.py and have never existed in
# HowToFit, which contains only chapter_*/tutorial_*.py — so neither pattern
# ever matched a file here.
#
# Do not copy override patterns between repos; a pattern that matches nothing
# is silently inert, not an override. Patterns without a '/' match the file
# stem exactly, so the two entries below match only the chapter 1 gradient
# tutorials. Never leave the `overrides:` key with an empty value — a bare
# `overrides:` loads as None; write `overrides: []` if every entry is removed.)
overrides:
  # The gradient tutorials teach JAX autodiff searches (MultiStartAdam, BlackJAXNUTS),
  # which refuse to run with use_jax=False, so JAX stays on for them.
  - pattern: "tutorial_6_gradients"
    set: {PYAUTO_DISABLE_JAX: "0"}
  - pattern: "tutorial_7_the_details"
    set: {PYAUTO_DISABLE_JAX: "0"}
